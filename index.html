<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>miezki-mauso-affairs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="grain"></div>

    <!-- Password Screen -->
    <div class="password-screen" id="passwordScreen">
        <div class="password-container">
            <p class="password-label">Zugang erforderlich</p>
            <div class="password-input-wrapper">
                <input 
                    type="password" 
                    class="password-input" 
                    id="passwordInput" 
                    placeholder="••••••••"
                    autocomplete="off"
                    autofocus
                >
            </div>
            <p class="password-error" id="passwordError">falsches passwort</p>
            <p class="password-hint">nur für miezki</p>
        </div>
    </div>

    <!-- Loading Sequence -->
    <div class="loader" id="loader">
        <div class="loader-content">
            <div class="loader-line" id="line1">
                <span class="dots"></span> initializing<span class="status"></span>
            </div>
            <div class="loader-line" id="line2">
                <span class="dots"></span> decrypting audio<span class="status"></span>
            </div>
            <div class="loader-line" id="line3">
                <span class="dots"></span> loading chapter_01<span class="status"></span>
            </div>
            <div class="loader-line" id="line4">
                <span class="dots"></span> establishing connection<span class="status"></span>
            </div>
            <div class="loader-line" id="line5">
                <span class="dots"></span> ready<span class="status"></span>
            </div>
        </div>
        <div class="loader-bar" id="loaderBar">
            <div class="loader-bar-fill" id="loaderBarFill"></div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="main" id="main">
        <header class="header">
            <p class="tag">dec 2025</p>
            <h1 class="title">
                Impro
                <span>visiert</span>
            </h1>
            <p class="chapter-num">chapter 01</p>
        </header>

        <div class="player">
            <div class="player-header">
                <span>audio.file</span>
                <div class="player-status">
                    <div class="status-dot" id="statusDot"></div>
                    <span id="statusText">standby</span>
                </div>
            </div>

            <div class="waveform" id="waveform"></div>

            <div class="controls">
                <button class="btn-secondary" id="backBtn" aria-label="15 Sekunden zurück">
                    <svg viewBox="0 0 24 24"><path d="M12.5 3C17.15 3 21.08 6.03 22.45 10.22L20.1 11C19.05 7.81 16.04 5.5 12.5 5.5C10.54 5.5 8.77 6.22 7.38 7.38L10 10H3V3L5.6 5.6C7.45 4 9.85 3 12.5 3M10 12V22H8V14H6V12H10M18 14V20C18 21.11 17.11 22 16 22H14C12.9 22 12 21.1 12 20V14C12 12.9 12.9 12 14 12H16C17.11 12 18 12.9 18 14M14 14V20H16V14H14Z"/></svg>
                </button>
                <button class="btn-play" id="playBtn" aria-label="Abspielen">
                    <svg class="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <svg class="pause-icon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                <button class="btn-secondary" id="forwardBtn" aria-label="15 Sekunden vor">
                    <svg viewBox="0 0 24 24"><path d="M11.5 3C6.85 3 2.92 6.03 1.55 10.22L3.9 11C4.95 7.81 7.96 5.5 11.5 5.5C13.46 5.5 15.23 6.22 16.62 7.38L14 10H21V3L18.4 5.6C16.55 4 14.15 3 11.5 3M10 12V22H8V14H6V12H10M18 14V20C18 21.11 17.11 22 16 22H14C12.9 22 12 21.1 12 20V14C12 12.9 12.9 12 14 12H16C17.11 12 18 12.9 18 14M14 14V20H16V14H14Z"/></svg>
                </button>
            </div>

            <div class="progress-container">
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill">
                        <div class="progress-handle"></div>
                    </div>
                </div>
                <div class="time-display">
                    <span id="currentTime">00:00</span>
                    <span id="duration">00:00</span>
                </div>
            </div>

            <div class="volume">
                <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                <div class="volume-bar" id="volumeBar">
                    <div class="volume-fill" id="volumeFill"></div>
                </div>
            </div>
        </div>

        <footer class="footer">
            <p class="footer-text">made with <span>♥</span></p>
        </footer>

        <audio id="audio">
            <source src="assets/audio/chapter-01.mp3" type="audio/mpeg">
        </audio>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
